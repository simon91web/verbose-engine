<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#CFE0AE" />
    <title>Lichtung – Welt (Prototyp)</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var wahl = localStorage.getItem('lichtung.stimmung') || 'geraet';
        var abend = wahl === 'abend' || (wahl === 'geraet' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.stimmung = abend ? 'abend' : 'tag';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/welt/main.tsx"></script>
  </body>
</html>
