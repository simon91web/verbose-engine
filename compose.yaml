# Lichtung auf dem eigenen Server
#   bauen und starten:   docker compose up -d --build
#   aktualisieren:       git pull && docker compose up -d --build
#   Einrichtungscode:    docker compose logs lichtung   (beim ersten Start, „Einrichtungscode: …“)
#   Passwort vergessen:  docker compose exec lichtung npm run passwort
services:
  lichtung:
    build: .
    image: lichtung:lokal
    # Statt selbst zu bauen, das fertige Image von GitHub nehmen (siehe README):
    # image: ghcr.io/simon91web/lichtung:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Datenbank und Nachtsicherungen. Ein benanntes Volume gehört dem Container-Nutzer automatisch.
      # Lieber einen Ordner? Statt der Zeile `lichtung-daten:/data` dies eintragen und den Ordner vorher
      # anlegen: `mkdir data && sudo chown 1000:1000 data`, dann `- ./data:/data`
      - lichtung-daten:/data
    environment:
      TZ: Europe/Berlin

volumes:
  lichtung-daten:
